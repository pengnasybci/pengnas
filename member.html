<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Member - Yaris Bapao Club Indonesia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Icon Logo -->
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="shortcut icon" type="image/png" href="images/ybci2.png">

    <!-- CSS FILES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ybci-red: #e60000;
            --ybci-dark: #121212;
            --ybci-light: #f9f9f9;
            --ybci-white: #ffffff;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background-color: var(--ybci-dark);
            color: var(--ybci-white);
            margin: 0;
            padding: 0 0 100px 0;
            overflow-x: hidden;
        }

        /* Navbar Konsisten */
        .navbar-ybci {
            background-color: rgba(18, 18, 18, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .navbar-ybci .navbar-brand img {
            max-height: 44px;
            transition: transform 0.3s ease;
        }
        .navbar-ybci .navbar-brand img:hover {
            transform: scale(1.05);
        }

        .navbar-ybci .nav-link {
            color: #cccccc !important;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px !important;
            transition: color 0.3s ease;
        }
        .navbar-ybci .nav-link:hover {
            color: var(--ybci-white) !important;
        }

        /* Container & Animasi Masuk */
        .container { 
            max-width: 1100px; 
            margin: 40px auto; 
            padding: 20px; 
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 { 
            color: var(--ybci-white); 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 40px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--ybci-red);
            display: inline-block;
            padding-left: 15px;
        }

        .header-wrapper {
            text-align: center;
        }

        /* Input & Select Custom */
        .form-select, #search {
            background: #1e1e1e !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--ybci-white) !important;
            border-radius: 12px;
            padding: 14px 18px;
            font-family: 'Unbounded', sans-serif;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .form-select:focus, #search:focus {
            border-color: var(--ybci-red) !important;
            box-shadow: 0 0 20px rgba(230, 0, 0, 0.3) !important;
        }

        /* Dashboard Cards dengan Efek Glow */
        .dashboard-card {
            border-radius: 14px;
            color: white;
            padding: 22px;
            text-align: center;
            font-weight: bold;
            min-height: 130px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            border-color: var(--ybci-red);
            box-shadow: 0 10px 30px rgba(230, 0, 0, 0.25);
        }
        .dashboard-card h5 { font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .dashboard-card h3 { font-size: 2.2rem; margin: 0; font-weight: 700; }

        .bg-member { background: linear-gradient(135deg, #1a1a1a, #251212); border-left: 4px solid var(--ybci-red); }
        .bg-short { background: linear-gradient(135deg, #1a1a1a, #1a1a1a); border-left: 4px solid #48dbfb; }

        /* Table Modern */
        .table-responsive {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            background: #151515;
        }
        .table { color: #eaeaea; margin-bottom: 0; font-size: 0.85rem; }
        .table thead th { 
            background: #1c1c1c; 
            color: var(--ybci-white); 
            border-bottom: 2px solid var(--ybci-red);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 16px;
        }
        .table tbody tr { background: #151515; transition: all 0.2s ease; }
        .table tbody tr:hover { background: #1e1e1e; transform: scale(1.002); }
        .table td { padding: 15px 16px; vertical-align: middle; border-color: rgba(255, 255, 255, 0.05); }

        /* Button Custom */
        .btn-custom {
            background: var(--ybci-red);
            border: none;
            color: white;
            font-weight: 600;
            font-family: 'Unbounded', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 24px;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.3);
        }
        .btn-custom:hover { 
            background: #cc0000; 
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 0, 0, 0.4);
        }

        /* Loading State Overlay */
        #loading-state {
            text-align: center;
            padding: 50px;
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Running Text di Bawah */
        .running-text {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            font-size: 28px;
            font-weight: bold;
            color: var(--ybci-white);
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            border-top: 2px solid var(--ybci-red);
            padding: 12px 0;
            z-index: 999;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Unbounded', sans-serif;
        }
        .running-text span {
            color: var(--ybci-red);
        }
    </style>
</head>
<body>

<!-- NAVBAR KONSISTEN -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-ybci">
    <div class="container-fluid px-4" style="max-width: 100% !important; margin: 0 !important;">
        <a class="navbar-brand me-3" href="index.html">
            <img src="images/ybci2.png" alt="YBCI Logo" class="img-fluid">
        </a>
        <div class="ms-auto">
            <a href="index.html" class="nav-link d-inline-block text-white fw-bold"><i class="bi-house-door me-1"></i> Back to Home</a>
        </div>
    </div>
</nav>

<div id="main-content">
    <div class="container">
        <div class="header-wrapper">
            <h2>Dashboard Member YBCI</h2>
        </div>

        <div class="row mb-4 align-items-center">
            <div class="col-md-4 mb-3">
                <select id="chapterFilter" class="form-select" onchange="updateDashboard()">
                    <option value="All">Semua Chapter</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <div class="dashboard-card bg-member">
                    <h5>Total Member</h5>
                    <h3 id="totalMember">0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="dashboard-card bg-short">
                    <h5>Total Short</h5>
                    <h3 id="totalShort">0</h3>
                </div>
            </div>
        </div>

        <input type="text" id="search" class="form-control mb-4" 
               placeholder="Cari nama, chapter, alamat, No HP..." onkeyup="applySearch()">

        <div class="table-responsive">
            <table class="table table-bordered table-dark">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Chapter</th>
                        <th>NRA</th>
                        <th>Alamat</th>
                        <th>No HP</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" id="loading-state"><div class="spinner-border spinner-border-sm text-danger me-2" role="status"></div> Memuat data member...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between mt-4 flex-wrap">
            <button class="btn btn-custom" onclick="prevPage()"><i class="bi-chevron-left me-1"></i> Sebelumnya</button>
            <button class="btn btn-custom" onclick="nextPage()">Berikutnya <i class="bi-chevron-right ms-1"></i></button>
        </div>
    </div>
</div>

<!-- RUNNING TEXT -->
<marquee class="running-text" behavior="scroll" direction="left">
    We Are Not a Club But We Are <span>Family</span> &mdash; Yaris Bapao Club Indonesia
</marquee>

<script>
const URL = "https://opensheet.elk.sh/1YML0A1VFlshLq3gsYQMZTVW0oDyDArencF1xqSoD_Ac/Sheet1";

let originalData = [];
let filteredData = [];
let currentPage = 1;
const rowsPerPage = 10;
let searchKeyword = "";

// Load data otomatis saat halaman dibuka
fetch(URL)
    .then(res => res.json())
    .then(data => {
        originalData = data;
        filteredData = data;
        populateChapterFilter();
        updateDashboard();
        renderTable();
    })
    .catch(err => {
        document.getElementById("table-body").innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data member. Periksa koneksi internet Anda.</td></tr>`;
    });

function populateChapterFilter() {
    const chapterSet = new Set(originalData.map(r => r.Chapter).filter(c => c));
    const chapterFilter = document.getElementById("chapterFilter");
    chapterSet.forEach(ch => {
        let option = document.createElement("option");
        option.value = ch;
        option.text = ch;
        chapterFilter.add(option);
    });
}

function renderTable() {
    const tableBody = document.getElementById("table-body");
    tableBody.innerHTML = "";

    if (filteredData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Data tidak ditemukan</td></tr>`;
        return;
    }

    let start = (currentPage - 1) * rowsPerPage;
    let end = start + rowsPerPage;
    let pageData = filteredData.slice(start, end);

    pageData.forEach(row => {
        tableBody.innerHTML += `
            <tr>
                <td>${row.Nama || ""}</td>
                <td>${row.Chapter || ""}</td>
                <td>${row.NRA || ""}</td>
                <td>${row.Alamat || ""}</td>
                <td>${row.hp || ""}</td>
            </tr>
        `;
    });
}

function nextPage() {
    if (currentPage * rowsPerPage < filteredData.length) {
        currentPage++;
        renderTable();
    }
}
function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderTable();
    }
}

function applySearch() {
    searchKeyword = document.getElementById("search").value.toLowerCase();
    currentPage = 1;
    updateDashboard();
}

function updateDashboard() {
    const selectedChapter = document.getElementById("chapterFilter").value;
    let dataToCount = originalData;

    if (selectedChapter !== "All") {
        dataToCount = originalData.filter(r => r.Chapter === selectedChapter);
    }

    if (searchKeyword) {
        dataToCount = dataToCount.filter(r =>
            (r.Nama || "").toLowerCase().includes(searchKeyword) ||
            (r.Chapter || "").toLowerCase().includes(searchKeyword) ||
            (r.NRA || "").toLowerCase().includes(searchKeyword) ||
            (r.Alamat || "").toLowerCase().includes(searchKeyword) ||
            (r.hp || "").toLowerCase().includes(searchKeyword)
        );
    }

    animateCount("totalMember", dataToCount.length);
    animateCount("totalShort", dataToCount.filter(r => !r.NRA).length);

    filteredData = dataToCount;
    currentPage = 1;
    renderTable();
}

function animateCount(id, endValue) {
    const el = document.getElementById(id);
    let startValue = parseInt(el.innerText) || 0;
    const duration = 600;
    const startTime = performance.now();

    function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Easing effect
        const easeProgress = 1 - Math.pow(1 - progress, 3); 
        el.innerText = Math.floor(startValue + (endValue - startValue) * easeProgress);
        if (progress < 1) requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
}
</script>

</body>
</html>
